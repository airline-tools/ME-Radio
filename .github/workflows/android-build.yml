name: Android build and release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-main
  cancel-in-progress: true

jobs:
  android-debug:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Reuse the same debug key so APK updates can be installed over existing installs.
      - name: Restore persistent Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: me-radio-android-debug-keystore-v1

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Calculate app version
        id: app_version
        run: |
          VERSION_CODE=$(( ${{ github.run_number }} + 1 ))
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=1.$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build versioned Android debug APK
        run: ./gradlew :composeApp:assembleDebug -PappVersionCode=${{ steps.app_version.outputs.version_code }} -PappVersionName=${{ steps.app_version.outputs.version_name }} --stacktrace

      - name: Prepare stable APK asset name
        run: cp composeApp/build/outputs/apk/debug/composeApp-debug.apk ME-Radio.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ME-Radio-debug-apk
          path: ME-Radio.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version_code }}
          name: ME-Radio ${{ steps.app_version.outputs.version_name }}
          target_commitish: main
          body: |
            Android app update.
            Release notes:
            - تحسينات وإصلاحات للتطبيق.
          files: ME-Radio.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
