name: Android build and release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-main
  cancel-in-progress: false

jobs:
  android-debug:
    name: Build and publish Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Restore a single persistent debug signing key. The cache key must never be changed.
      - name: Restore persistent Android debug signing key
        id: android_signing_cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: me-radio-android-debug-keystore-v2

      # Create the key BEFORE Gradle builds the APK, so the exact same key is saved afterwards.
      - name: Ensure persistent Android debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            echo "No cached signing key found. Creating the permanent ME-Radio Android signing key."
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=ME-Radio,C=US" \
              -noprompt
          else
            echo "Restored the existing ME-Radio Android signing key."
          fi
          test -s "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Calculate app version
        id: app_version
        run: |
          VERSION_CODE=$(( ${{ github.run_number }} + 1 ))
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=1.$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Build versioned Android APK
        run: ./gradlew :composeApp:assembleDebug -PappVersionCode=${{ steps.app_version.outputs.version_code }} -PappVersionName=${{ steps.app_version.outputs.version_name }} --stacktrace

      # Save the key explicitly AFTER it has been created and used by the build.
      - name: Save persistent Android debug signing key
        if: steps.android_signing_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.android/debug.keystore
          key: me-radio-android-debug-keystore-v2

      - name: Verify APK signing certificate matches persistent key
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"
          EXPECTED="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -nE 's/.*SHA256:[[:space:]]*//Ip' | head -n 1 | tr -d ':[:space:]' | grep -Eio '[0-9a-f]{64}' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          ACTUAL="$("$APKSIGNER" verify --print-certs composeApp/build/outputs/apk/debug/composeApp-debug.apk | grep -i 'certificate SHA-256 digest' | grep -Eio '[0-9a-f]{64}' | head -n 1 | tr '[:upper:]' '[:lower:]')"
          echo "Persistent keystore SHA-256: $EXPECTED"
          echo "APK signer SHA-256:          $ACTUAL"
          test -n "$EXPECTED" && test "$EXPECTED" = "$ACTUAL" || {
            echo "::error::APK is not signed with the persistent keystore."
            exit 1
          }

      - name: Prepare stable APK asset name
        run: cp composeApp/build/outputs/apk/debug/composeApp-debug.apk ME-Radio.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ME-Radio-debug-apk
          path: ME-Radio.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish latest Android release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version_code }}
          name: ME-Radio ${{ steps.app_version.outputs.version_name }}
          target_commitish: main
          body: |
            Android app update.
            Release notes:
            - تحسينات وإصلاحات للتطبيق.
          files: ME-Radio.apk
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
